# Builds everything a Steam Deck needs and publishes it as GitHub release
# assets, so install.sh can fetch it with nothing but curl:
#
#   steamduck-linux-amd64        the steamduck binary (static, no cgo)
#   kwakore-linux-amd64.tar.gz   kwakore built from a pinned commit
#   kwakore-install.sh           kwakore's install helper from that commit
#   install.sh                   steamduck's one-line installer
#   SHA256SUMS                   checksums of all of the above
#
# Pushes to master refresh the rolling "nightly" prerelease; v* tags make
# a normal release.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kwakore publishes no releases yet, so it is built here from source.
  # Bump this to ship a newer kwakore.
  KWAKORE_REPO: hzrd149/kwakore
  KWAKORE_REF: 4ef4c1297842663034a56fd9b1df7db91dd976d2

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/store/web/package-lock.json
      - run: npm ci
        working-directory: internal/store/web
      - run: npm run typecheck
        working-directory: internal/store/web
      - run: npm run build
        working-directory: internal/store/web
      - run: git diff --exit-code -- internal/store/built
      - run: npx playwright install --with-deps chromium
        working-directory: internal/store/web
      - run: npm test
        working-directory: internal/store/web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: bash -n install.sh

  kwakore:
    runs-on: ubuntu-24.04
    # Ubuntu 22.04's glibc (2.35) is older than any current SteamOS, so the
    # cgo binaries run there; building on a newer image would not.
    container: ubuntu:22.04
    defaults:
      run:
        # the bare container's default is sh
        shell: bash
    steps:
      # Just enough for the action steps below: checkout needs git, and the
      # cache actions (actions/cache and setup-go's built-in Go cache) need
      # tar+zstd to pack archives -- without zstd they silently no-op in this
      # bare container. The heavy build deps are only installed on a miss.
      - name: bootstrap actions tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git tar zstd
      # KWAKORE_REF pins both the sources and the bundle script that builds
      # them, so the bundle is identical until the pin moves. Cache the
      # finished bundle and skip the whole gtk/webkit build on every push
      # that keeps the same pin. No restore-keys on purpose: a prefix match
      # would restore a bundle built from a different ref. If GitHub evicts
      # the cache after 7 idle days, the job simply builds it again.
      - name: restore kwakore bundle
        id: bundle
        uses: actions/cache@v6
        with:
          path: upload
          key: kwakore-bundle-amd64-${{ env.KWAKORE_REF }}
      - name: build dependencies
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config util-linux \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/checkout@v7
        if: steps.bundle.outputs.cache-hit != 'true'
        with:
          repository: ${{ env.KWAKORE_REPO }}
          ref: ${{ env.KWAKORE_REF }}
          path: kwakore
      - uses: actions/setup-go@v7
        if: steps.bundle.outputs.cache-hit != 'true'
        with:
          go-version-file: kwakore/backend/go.mod
          cache-dependency-path: |
            kwakore/backend/go.sum
            kwakore/desktop/go.sum
      - name: build bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          version="0.0.0-${KWAKORE_REF:0:12}"
          bash kwakore/scripts/build-linux-bundle.sh --arch amd64 --version "$version" --out "$PWD/kwakore-dist"
          mkdir upload
          cp "kwakore-dist/$version/kwakore-linux-amd64.tar.gz" upload/
          cp kwakore/scripts/install.sh upload/kwakore-install.sh
          ldd "kwakore-dist/$version/kwakore-$version-linux-amd64/kwaklet" || true
      - uses: actions/upload-artifact@v7
        with:
          name: kwakore
          path: upload/*
          if-no-files-found: error

  steamduck:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/store/web/package-lock.json
      - run: npm ci
        working-directory: internal/store/web
      - run: npm run build
        working-directory: internal/store/web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version="nightly-${GITHUB_SHA:0:12}"
          fi
          mkdir upload
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o upload/steamduck-linux-amd64 ./cmd/steamduck
          cp install.sh upload/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: steamduck
          path: upload/*
          if-no-files-found: error

  release:
    needs: [kwakore, steamduck]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: publish tagged release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: publish nightly
        if: github.ref_type != 'tag'
        run: |
          notes="Rolling build of ${GITHUB_SHA} (kwakore ${KWAKORE_REF}).

          Install on a Steam Deck (desktop mode, Konsole):

              curl -fsSL https://github.com/${GH_REPO}/releases/download/nightly/install.sh | bash -s -- --nightly"
          # point the nightly tag at this commit
          gh api "repos/${GH_REPO}/git/refs/tags/nightly" -X PATCH -f sha="$GITHUB_SHA" -F force=true ||
            gh api "repos/${GH_REPO}/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --verify-tag
          fi
          gh release upload nightly assets/* --clobber
